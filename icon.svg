<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- کتاب -->
  <g transform="translate(256,256)">
    <!-- کتاب چپ -->
    <path d="M-160,-100 Q-160,-130 -120,-130 L-20,-130 L-20,110 L-120,110 Q-160,110 -160,80 Z" fill="#fff" opacity="0.95"/>
    <!-- کتاب راست -->
    <path d="M160,-100 Q160,-130 120,-130 L20,-130 L20,110 L120,110 Q160,110 160,80 Z" fill="#fff" opacity="0.95"/>
    <!-- خطوط صفحه چپ -->
    <line x1="-130" y1="-80" x2="-40" y2="-80" stroke="#667eea" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <line x1="-130" y1="-50" x2="-40" y2="-50" stroke="#667eea" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <line x1="-130" y1="-20" x2="-40" y2="-20" stroke="#667eea" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <line x1="-130" y1="10" x2="-40" y2="10" stroke="#667eea" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <!-- خطوط صفحه راست -->
    <line x1="40" y1="-80" x2="130" y2="-80" stroke="#667eea" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <line x1="40" y1="-50" x2="130" y2="-50" stroke="#667eea" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <line x1="40" y1="-20" x2="130" y2="-20" stroke="#667eea" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <line x1="40" y1="10" x2="130" y2="10" stroke="#667eea" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  </g>
  <!-- ستاره (نشان هدف) -->
  <circle cx="380" cy="380" r="52" fill="#f39c12" stroke="#fff" stroke-width="8"/>
  <text x="380" y="405" font-size="60" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold">★</text>
</svg>