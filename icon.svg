
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- گرادیانت پس‌زمینه -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <!-- گرادیانت برگ -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <!-- افکت نور و درخشش -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- افکت سایه -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- پس‌زمینه (گوشه‌های گرد استاندارد اپل و اندروید) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- خط ضربان (نشانه پالس و تمرکز) -->
  <path d="M 80 256 L 170 256 L 200 180 L 250 330 L 280 256 L 432 256" fill="none" stroke="#2dd4bf" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.8"/>
  
  <!-- کتاب باز (نشانه دانش) -->
  <g filter="url(#shadow)">
    <path d="M 256 200 Q 170 170 110 210 L 110 390 Q 170 350 256 380 Z" fill="#ffffff" />
    <path d="M 256 200 Q 342 170 402 210 L 402 390 Q 342 350 256 380 Z" fill="#ffffff" />
    
    <!-- خطوط داخل کتاب -->
    <path d="M 150 250 Q 190 230 230 260 M 150 300 Q 190 280 230 310 M 150 350 Q 190 330 230 360" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    <path d="M 362 250 Q 322 230 282 260 M 362 300 Q 322 280 282 310 M 362 350 Q 322 330 282 360" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  </g>
  
  <!-- جوانه و برگ (نشانه رشد و باغ مطالعه) -->
  <g filter="url(#glow)">
    <path d="M 256 220 Q 280 140 340 120 Q 310 190 256 220 Z" fill="url(#leafGrad)" />
    <path d="M 256 220 Q 230 160 180 140 Q 210 200 256 220 Z" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M 256 220 L 256 250" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
